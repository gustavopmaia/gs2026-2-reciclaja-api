[project]
name = "reciclaja-api"
version = "1.0.0"
description = "ReciclaJá — pontos de coleta e orientação de descarte (GS2026.2 2CCPY)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # strings de orientação ao cidadão são longas de propósito; o formatter cuida do resto

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"]
