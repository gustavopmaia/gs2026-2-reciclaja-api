name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, contrato, testes e evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4_slice
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 4_slice/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Validar contrato OpenAPI
        run: openapi-spec-validator ../2_contrato_api.yaml

      - name: Testes + cobertura (meta RNF-02 >= 80%)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Evals de regressão (fake determinístico)
        run: python evals/run_evals.py

      - name: Scan de segredos (RNF-04)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Compose sobe e responde
    runs-on: ubuntu-latest
    needs: qualidade
    defaults:
      run:
        working-directory: 4_slice
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack
        run: docker compose up -d --build --wait api
      - name: Smoke test do contrato
        run: |
          curl -fsS localhost:8000/v1/health
          curl -fsS localhost:8000/v1/points/PC-001
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/points/PC-999)" = "404"
          curl -fsS -X POST localhost:8000/v1/ask -H 'Content-Type: application/json' -d '{"question":"onde jogo pilha?"}'
      - name: Derrubar stack
        if: always()
        run: docker compose down
